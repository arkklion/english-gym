<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AMAKUMA 英語ジム</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#EAF5FB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="英語ジム">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: one-column phone app — sticky brand bar, stacked cards, fixed bottom tab bar */
:root{
  --bg:#EAF5FB; --surface:#FFFFFF; --soft:#D9EEF9; --line:#C6DFEE;
  --ink:#1B3243; --muted:#557083;
  --accent:#86CBEB; --strong:#2580B5; --on-strong:#FFFFFF;
  --good:#258F61; --good-soft:#DCF2E7; --bad:#C94858; --bad-soft:#FBE2E5;
  --gold:#C98A12; --gold-soft:#FBEFD3;
  --fur:#F3E6D6; --fur2:#FFF8EF; --fur-line:#C9B49B; --pink:#F2A5B5; --face:#3A2C24;
  --display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  --en:"M PLUS Rounded 1c",ui-rounded,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1B25; --surface:#152836; --soft:#1C3A4E; --line:#29465A;
  --ink:#E4F0F7; --muted:#97B1C3;
  --accent:#86CBEB; --strong:#8CCFF0; --on-strong:#0E1B25;
  --good:#62CB9B; --good-soft:#163A2C; --bad:#F08995; --bad-soft:#3F1E25;
  --gold:#F0C35E; --gold-soft:#3A2E14;
  --fur:#EADBC8; --fur2:#FBF2E6; --fur-line:#9C8770; --pink:#E58FA2; --face:#2E231D; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1B25; --surface:#152836; --soft:#1C3A4E; --line:#29465A;
  --ink:#E4F0F7; --muted:#97B1C3;
  --accent:#86CBEB; --strong:#8CCFF0; --on-strong:#0E1B25;
  --good:#62CB9B; --good-soft:#163A2C; --bad:#F08995; --bad-soft:#3F1E25;
  --gold:#F0C35E; --gold-soft:#3A2E14;
  --fur:#EADBC8; --fur2:#FBF2E6; --fur-line:#9C8770; --pink:#E58FA2; --face:#2E231D; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);max-width:560px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;padding-block:12px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:17px;color:var(--strong)}
.brand svg{fill:currentColor}
.proto{font-size:11px;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
h1,h2{font-family:var(--display);font-weight:800;line-height:1.35;margin:0;text-wrap:balance}
h1{font-size:24px} h2{font-size:19px} .h-sm{font-size:15px}
p{margin:0}
.eyebrow{font-family:var(--display);font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--strong);margin:0 0 4px}
.muted{color:var(--muted)} .small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.vh{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.btn{background:var(--strong);color:var(--on-strong);border:0;border-radius:14px;padding:13px 18px;font-family:var(--display);font-weight:800;font-size:16px;width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--strong);border:2px solid var(--strong)}
.mini{background:var(--soft);color:var(--strong);border:0;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px}

/* hero + character */
.hero{background:linear-gradient(160deg,var(--soft),var(--surface));border:1px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px}
.hero-top{display:grid;grid-template-columns:minmax(120px,42%) 1fr;gap:14px;align-items:center}
.hero-info{display:flex;flex-direction:column;gap:6px;min-width:0}
.bear svg{width:100%;height:auto;display:block}
.lv{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1;color:var(--strong)}
.lv span{display:block;font-size:15px;color:var(--ink);margin-top:4px}
.pw{font-size:13px;color:var(--muted)} .pw b{font-family:var(--display);font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.ladder{display:flex;gap:4px}
.ladder i{flex:1;height:6px;border-radius:999px;background:var(--line)}
.ladder i.on{background:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--surface);border-radius:14px;padding:8px 4px;text-align:center;display:flex;flex-direction:column}
.stats b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--muted)}
.parts{display:flex;flex-direction:column;gap:10px}
.chhome{display:flex;flex-direction:column;gap:8px}
.ai-rate{font-weight:800;color:var(--strong);font-size:18px}
.rank-stamps{display:flex;gap:8px}
.rank-stamps i{width:34px;height:34px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-style:normal;font-size:14px;color:var(--muted)}
.rank-stamps i.on{border:2px solid var(--gold);background:var(--gold-soft);font-size:18px}
.done .rank-stamps{justify-content:center}
.pill.lock{opacity:.6}

.kchips{display:flex;flex-wrap:wrap;gap:6px}
.kchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-family:var(--en);font-size:14px;color:var(--ink)}
.kchip.on{background:var(--soft);border-color:var(--strong)}
.seg{gap:8px}
.seg-b{flex:1 1 0;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 6px;font-weight:700;color:var(--ink);min-height:44px}
.seg-b.on{border-color:var(--strong);background:var(--soft);color:var(--strong)}
.fbgrid{display:flex;flex-direction:column;gap:8px}
.fbi{background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.fbi>b{font-size:12px;color:var(--strong);font-family:var(--display)}
.fbi p{margin:0}.fbi ul{margin:0;padding-left:1.2em}
.exs summary{cursor:pointer;font-size:13px;color:var(--strong);font-weight:700;padding:4px 0}
.exs ul{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.exs .en{font-family:var(--en)}
.live{min-height:1.5em}
.sk .mic{margin:4px auto}
.timer.prep .tgauge i{background:var(--muted)}
.chap.quiet{opacity:.75}

.chhome .mini{align-self:flex-start}
.chlist{display:flex;flex-direction:column;gap:10px}
.chap{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;color:var(--ink)}
.chap.next{border:2px solid var(--strong)}
.chap.clear{background:var(--soft)}
.chic{width:52px;height:52px;border-radius:16px;background:var(--soft);display:grid;place-items:center;font-size:28px}
.chap.clear .chic{background:var(--surface)}
.chtx{display:flex;flex-direction:column;gap:2px;min-width:0}
.chtx small{font-size:11px;color:var(--muted)}
.chtx small em{font-style:normal;margin-left:6px;background:var(--strong);color:var(--on-strong);border-radius:999px;padding:1px 8px;font-weight:700}
.chtx b{font-family:var(--display);font-size:17px}
.chtx>span{font-size:12px;color:var(--muted);line-height:1.5}
.chtx .chsk{letter-spacing:2px;font-size:13px}
.chst{display:flex;flex-direction:column;align-items:center;font-variant-numeric:tabular-nums}
.chst b{font-family:var(--display);font-size:20px;color:var(--strong)}
.chst small{font-size:11px;color:var(--muted)}
.skill{display:flex;align-items:center;gap:6px;margin:0;font-family:var(--display);font-weight:800;color:var(--strong)}
.skill small{margin-left:auto;font-family:var(--body);font-weight:400;color:var(--muted);font-size:12px}
.lrn{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lrn li{display:grid;grid-template-columns:36px 1fr auto;grid-template-rows:auto auto;column-gap:10px;align-items:center;background:var(--bg);border-radius:14px;padding:8px 12px}
.lrn .em{grid-row:span 2;font-size:26px;text-align:center}
.lrn .en{font-family:var(--en);font-weight:700;font-size:18px}
.lrn .ja{grid-column:2;font-size:12px;color:var(--muted)}
.lrn .mini{grid-column:3;grid-row:1/span 2}
.dlg{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left}
.line{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start}
.line .who{font-size:11px;font-weight:700;color:var(--muted);padding-top:10px;min-width:3.4em}
.bub{background:var(--soft);border-radius:14px;padding:8px 12px}
.line.b .bub{background:var(--bg);border:1px solid var(--line)}
.bub .en{font-family:var(--en);font-size:16px;margin:0;line-height:1.5}
.bub .ja{font-size:12px;color:var(--muted);margin:2px 0 0}
.line .mini{margin-top:6px}
.mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--strong);color:var(--on-strong);font-size:34px;display:grid;place-items:center;box-shadow:0 6px 0 var(--soft)}
.mic.on{background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
.done h1.chclear{font-size:24px;line-height:1.35}
.sklist{display:flex;flex-direction:column;gap:6px;width:100%}
.sklist div{display:grid;grid-template-columns:28px 1fr auto;align-items:center;background:var(--bg);border-radius:12px;padding:6px 12px;text-align:left;font-variant-numeric:tabular-nums}
.sklist b{font-size:14px}

.part{display:grid;grid-template-columns:5.5em 1fr 3.5em;gap:10px;align-items:center;font-size:13px}
.part b{font-family:var(--display);font-size:13px}
.part span{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.trains{display:flex;flex-direction:column;gap:10px}
.train{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;text-align:left}
.train .ic{width:52px;height:52px;border-radius:16px;background:var(--soft);display:grid;place-items:center}
.train .ic svg{stroke:var(--strong)}
.train b{font-family:var(--display);font-size:17px;display:block}
.train small{font-size:12px;color:var(--muted);display:block;line-height:1.5}
.lvtag{font-family:var(--display);font-weight:800;color:var(--strong);font-size:14px}
.train .go{font-family:var(--display);font-weight:800;color:var(--strong);font-size:20px}
.linkcard{background:transparent;border:2px dashed var(--line);border-radius:18px;padding:14px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px}
.linkcard b{font-family:var(--display);font-size:15px;display:block}
.linkcard small{color:var(--muted);font-size:12px}

/* pills, gauges, reps */
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.pill{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-family:var(--display);font-weight:800;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.pill small{font-family:var(--body);font-weight:400;font-size:10px;color:var(--muted)}
.pill.on{background:var(--strong);color:var(--on-strong);border-color:var(--strong)}
.pill.on small{color:var(--on-strong)}
.gauge{height:12px;background:var(--soft);border-radius:999px;overflow:hidden}
.gauge i{display:block;height:100%;background:var(--strong);border-radius:999px;transition:width .5s}
.gauge.gold i{background:var(--gold)}
.glabel{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.reps{display:inline-flex;gap:4px;vertical-align:middle}
.togo{margin:10px 0 4px;padding:10px 12px;border-radius:12px;background:var(--line)}
.togo p{margin:0 0 4px}
.togo-row{display:flex;align-items:center;gap:10px;padding:2px 0}
.togo-row b{margin-left:auto}
.togo-mk{min-width:3.6em;color:var(--strong);letter-spacing:2px}
.reps i{width:11px;height:11px;border-radius:50%;background:var(--line)}
.reps i.on{background:var(--strong)}
.reps.done i{background:var(--gold)}
.wlist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.wlist li{aspect-ratio:1/1;max-width:100%;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 6px;overflow:hidden}
.wlist .em{font-size:28px;line-height:1.1}
.wlist .em:empty{display:none}
.wlist .en{font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.wlist .reps{margin-top:2px}
.em{font-size:24px;line-height:1}
.en{font-family:var(--en);font-weight:800}
.wlist .ja{font-size:11px;line-height:1.35;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{align-items:flex-start}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:10px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:18px;aspect-ratio:1/1;max-width:100%;min-width:0;padding:10px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;overflow:hidden}
.cat .ci{font-size:30px;line-height:1.1}
.cat b{font-family:var(--display);font-size:13px;line-height:1.3;overflow-wrap:anywhere}
.cat small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.cat .gauge{width:80%;height:6px;margin-top:2px}
.cat:active{background:var(--soft)}
.cat summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:1fr 96px;gap:12px;align-items:center}
.cat summary::-webkit-details-marker{display:none}
.cat summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:16px}
.cat[open] summary{border-bottom:1px solid var(--line)}
.cn{display:flex;flex-direction:column;line-height:1.4;min-width:0}
.cn b{font-family:var(--display);font-size:15px}
.cn small{font-size:12px;color:var(--muted)}
.catbody{padding:12px;display:flex;flex-direction:column;gap:10px}
.catbody .wlist li{background:var(--bg)}
.q .tag{align-self:center}

/* modes */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode.on{border-color:var(--strong);background:var(--soft)}
.mode.lock{opacity:.55}
.stages{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px}
.stages i{font-style:normal;color:var(--muted)}
.st-step{padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted)}
.st-step.now{background:var(--strong);color:var(--on-strong);font-weight:700}
.st-step.ok{background:var(--good-soft);color:var(--good)}
.gcat .gauge{width:80%;height:6px;margin-top:2px}
.goal{background:linear-gradient(160deg,var(--soft),var(--surface))}
.goal-ex{font-family:var(--en);font-weight:500;font-size:14px;line-height:1.6;background:var(--surface);border-radius:12px;padding:8px 10px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.gcat b{font-size:12px}
.gcat .kw{font-family:var(--en);font-size:10.5px;line-height:1.3;color:var(--muted)}
.gcat.clear{background:var(--gold-soft);border-color:var(--gold)}
.mode{background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.mode b{font-family:var(--display);font-size:15px}
.mode span{font-family:var(--display);font-weight:800;font-size:12px;color:var(--strong)}
.mode small{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.4}
.glist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.glist li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.glist li div{min-width:0}
.glist b{font-size:14px;display:block}
.glist em{font-style:normal;font-family:var(--en);font-size:13px;color:var(--muted)}

/* session */
.sbar{display:flex;align-items:center;gap:10px}
.sbar .gauge{flex:1}
.timer{display:flex;align-items:center;gap:8px;margin-top:-8px}
.tgauge{flex:1;height:6px;background:var(--soft);border-radius:999px;overflow:hidden}
.tgauge i{display:block;height:100%;background:var(--accent);border-radius:999px}
.tsec{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:4.5em;text-align:right}
.timer.warn .tgauge i{background:var(--bad)}
.timer.warn .tsec{color:var(--bad);font-weight:700}
.timer.stop{opacity:.4}
.sbar .cnt{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.combo{font-family:var(--display);font-weight:800;font-size:12px;color:var(--gold);background:var(--gold-soft);border-radius:999px;padding:2px 10px}
.quit{background:none;border:0;color:var(--muted);font-size:13px;padding:4px}
.q{align-items:center;text-align:center;padding-block:26px}
.play{width:84px;height:84px;border-radius:50%;border:0;background:var(--strong);color:var(--on-strong);font-size:30px;display:grid;place-items:center;box-shadow:0 6px 0 var(--soft)}
.play:active{transform:translateY(3px);box-shadow:0 3px 0 var(--soft)}
.hint{background:none;border:1px dashed var(--line);border-radius:999px;padding:4px 14px;font-size:13px;color:var(--muted)}
.pic{font-size:64px;line-height:1.1}
.prompt{font-size:20px;font-weight:700}
.sent{font-family:var(--en);font-size:21px;font-weight:500;line-height:1.6}
.jasub{font-size:13px;color:var(--muted);margin:6px 0 0}
.cvc{font-family:var(--en);font-size:40px;font-weight:800;letter-spacing:.18em}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--strong);color:var(--strong)}
.cvc .blank{min-width:1em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.c3{grid-template-columns:repeat(3,1fr)}
.opts.c5{grid-template-columns:repeat(5,1fr);gap:6px}
.opts.c4{grid-template-columns:repeat(4,1fr);gap:8px}
.abcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}
.cell{aspect-ratio:1;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:4px}
.cl{font-family:var(--en);font-weight:800;font-size:19px;line-height:1}
.cell.clear{background:var(--gold-soft);border-color:var(--gold)}
.stamp{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:2px solid var(--bad);background:var(--surface);font-size:15px;line-height:1;transform:rotate(-12deg)}

const GRAMMAR_ROWS=[["中1-01-1","中1-01","be動詞（am / are / is）","I am from Japan.","私は日本出身です。","am","is","is は he・she・it（1人・1つ）のときに使うよ。I のときは am だよ。","are","are は you・we・they のときに使うよ。I のときは am だよ。","「〜です」は be動詞で表すよ。I には am、you と2人以上には are、1人・1つには is を使うよ。","I'm from Japan."],["中1-01-2","中1-01","be動詞（am / are / is）","She is not a student.","彼女は学生ではありません。","not","no","「〜ではない」は be動詞のすぐあとに not を置くよ。no は使わないよ。","don't","be動詞の文では don't は使わないよ。is のあとに not を置こう。","be動詞の否定文は、am / are / is のあとに not を置くよ。","She isn't a student.／She's not a student."],["中1-01-3","中1-01","be動詞（am / are / is）","Are you hungry?","おなかすいてる？","Are","Do","hungry は「おなかがすいた」という様子を表す言葉。様子をたずねるときは be動詞の Are を使うよ。","Is","you には are を使うよ。Is は he・she・it のときだよ。","be動詞の疑問文は、am / are / is を文の一番前に出すよ。",""],["中1-01-4","中1-01","be動詞（am / are / is）","My room is small.","私の部屋は小さいです。","is","are","My room（私の部屋）は1つなので is だよ。","am","am は I のときだけ使うよ。","主語が1人・1つのときは is を使うよ。",""],["中1-02-1","中1-02","一般動詞の現在形","I like music.","私は音楽が好きです。","like","likes","I のときは動詞に s をつけないよ。","am","like は動詞なので、be動詞の am はいらないよ。","「好き」「する」など動作や気持ちを表す動詞（一般動詞）は、be動詞といっしょに使わないよ。",""],["中1-02-2","中1-02","一般動詞の現在形","She plays tennis every Sunday.","彼女は毎週日曜日にテニスをします。","plays","play","主語が She（1人）なので、動詞に s をつけるよ。","playing","playing だけでは文にならないよ。","主語が he / she / it や1人・1つのとき、今のことを言う文では動詞に s をつけるよ。",""],["中1-02-3","中1-02","一般動詞の現在形","I don't have a car.","私は車を持っていません。","don't","doesn't","doesn't は he・she・it のとき。I には don't だよ。","am not","have は一般動詞なので、否定文は don't を使うよ。am not は be動詞の文のときだよ。","一般動詞の否定文は、動詞の前に don't（he / she なら doesn't）を置くよ。","I do not have a car."],["中1-02-4","中1-02","一般動詞の現在形","Does he work at a cafe?","彼はカフェで働いていますか？","Does","Do","主語が he（1人）なので Does だよ。","Is","work は一般動詞なので、疑問文は Does を使うよ。","一般動詞の疑問文は Do / Does を文の最初に置いて、動詞は s をつけない形にもどすよ。",""],["中1-03-1","中1-03","代名詞（I / me / my / mine）","This is my bag.","これは私のかばんです。","my","me","me は「私を・私に」。「私の」は my だよ。","I","I は「私は」。「私の〜」は my だよ。","「私は」I、「私の」my、「私を」me、「私のもの」mine と形が変わるよ。",""],["中1-03-2" e them.","彼らは私のクラスメートです。私は彼らが好きです。","them","they","like のあとの「〜を」は them を使うよ。","their","their は「彼らの」。あとに名詞が必要だよ。","they（彼らは）→ their（彼らの）→ them（彼らを）。",""],["中1-05-4","中1-05","人称代名詞と所有格（he / his、she / her）","Is this your phone?","これはあなたのスマホですか？","your","you","you は「あなたは・あなたを」。「あなたの」は your だよ。","yours","yours は「あなたのもの」。phone の前には your だよ。","you（あなたは）→ your（あなたの）→ yours（あなたのもの）。",""],["中1-06-1","中1-06","疑問詞（what / who / where / when / how）","Where is the station?","駅はどこですか？","Where","What","What は「何」。場所をたずねるときは Where だよ。","When","When は「いつ」。場所は Where だよ。","場所は where、時は when、物は what、人は who、方法や様子は how でたずねるよ。",""],["中1-06-2","中1-06","疑問詞（what / who / where / when / how）","What time is it now?","今、何時ですか？","What","How","時刻は What time でたずねるよ。","When","When は「いつ」。「何時」と時刻を聞くときは What time だよ。","「何時？」は What time 〜? を使うよ。",""],["中1-06-3","中1-06","疑問詞（what / who / where / when / how）","Who is that man?","あの男の人はだれですか？","Who","Where","Where は「どこ」。人をたずねるときは Who だよ。","Which","Which は「どちら」。人をたずねるときは Who だよ。","「だれ？」は Who でたずねるよ。",""],["中1-06-4","中1-06","疑問詞（what / who / where / when / how）","How much is this bag?","このかばんはいくらですか？","much","many","How many は数をたずねるとき。値段は How much だよ。","old","How old は年齢をたずねるときだよ。","値段は How much、数は How many でたずねるよ。",""],["中1-07-1","中1-07","命令文、Let's ～.","Open the window, please.","窓を開けてください。","Open","Opens","命令文は、動詞をそのままの形で文の最初に置くよ。s はつけないよ。","You open","You で始めると「あなたは開ける」という意味になるよ。","「〜して」と言うときは、主語を言わずに動詞から始めるよ。","Please open the window."],["中1-07-2","中1-07","命令文、Let's ～.","Don't touch the cake.","ケーキにさわらないで。","Don't","Not","「〜しないで」は Don't で始めるよ。","No","No touch とは言わないよ。Don't を使おう。","「〜しないで」は Don't ＋ 動詞で表すよ。","Do not touch the cake."],["中1-07-3","中1-07","命令文、Let's ～.","Let's go to the beach.","浜辺に行こうよ。","Let's","Let","「〜しよう」は Let's（Let us）だよ。's を忘れずに。","We","We go だと「私たちは行く」という意味になるよ。","「〜しよう」と誘うときは Let's ＋ 動詞。",""],["中1-07-4","中1-07","命令文、Let's ～.","Be careful.","気をつけて。","Be","Are","命令文では be動詞は Be の形で使うよ。","Is","命令文は Be で始めるよ。","careful（注意深い）のような様子を表す言葉で「〜でいて」と言うときは Be 〜. を使うよ。",""],["中1-08-1","中1-08","can を使う文","I can play the piano.","私はピアノをひけます。","can","am","「〜できる」は can。am は be動詞だよ。","cans","can には s をつけないよ。","「〜できる」は can ＋ 動詞のそのままの形。",""],["中1-08-2","中1-08","can を使う文","She can't swim.","彼女は泳げません。","can't","don't","「〜できない」は can't（cannot）だよ。","isn't","isn't は be動詞の否定。「泳げない」は can't だよ。","「〜できない」は can't ＋ 動詞。","She cannot swim."],["中1-08-3","中1-08","can を使う文","Can I use this pen?","このペンを使ってもいいですか？","Can","Do","「〜してもいい？」とたずねるときは Can I 〜? だよ。","Am","Am I use とは言わないよ。","Can I 〜? は「〜してもいいですか？」とお願いするときに使うよ。",""],["中1-08-4","中1-08","can を使う文","Can you speak English?","英語を話せますか？","speak","speaks","can のあとの動詞は、s をつけないそのままの形だよ。","speaking","can のあとは speaking ではなく speak だよ。","can のあとの動詞は、いつもそのままの形。",""],["中1-09-1","中1-09","現在進行形","I am cooking dinner now.","私は今、夕ごはんを作っています。","cooking","cook","「今〜している」は am ＋ cooking（ing の形）だよ。","cooked","cooked は「料理した」（過去）。今していることは cooking だよ。","「今〜している」は be動詞 ＋ 動詞の ing 形。","I'm cooking dinner now."],["中1-09-2","中1-09","現在進行形","They are playing soccer in the park.","彼らは公園でサッカーをしています。","are","is","They（彼ら）は2人以上なので are だよ。","do","進行形は be動詞を使うよ。do は使わないよ。","主語に合わせて am / are / is を選び、動詞を ing の形にするよ。","They're playing soccer in the park."],["中1-09-3","中1-09","現在進行形","What are you doing?","何をしているの？","doing","do","are といっしょに使うときは ing の形 doing だよ。","does","does は be動詞といっしょには使わないよ。","「何をしているの？」は What are you doing? と言うよ。",""],["中1-09-4","中1-09","現在進行形","She isn't sleeping.","彼女は眠っていません。","isn't","doesn't","進行形の否定は be動詞のあとに not。doesn't は使わないよ。","not","主語のあとに be動詞が必要だよ。isn't（is not）を使おう。","進行形の否定文は、be動詞のあとに not を置くよ。","She is not sleeping."],["中1-10-1","中1-10","一般動詞の過去形","I visited my grandmother yesterday.","私は昨日、祖母をたずねました。","visited","visit","yesterday（昨日）があるので、過去の形 visited にするよ。","visits","visits は今のこと。昨日のことは visited だよ。","過去のことは、動詞に ed をつけて表すよ。",""],["中1-10-2","中1-10","一般動詞の過去形","We watched a movie last night.","私たちは昨夜、映画を見ました。","watched","watch","last night（昨夜）は過去なので watched だよ。","watching","watching だけでは文にならないよ。","last night や yesterday があったら、動詞を過去の形にしよう。",""],["中1-10-3","中1-10","一般動詞の過去形","Did you eat breakfast?","朝ごはんを食べましたか？","Did","Do","過去のことをたずねるときは Did を使うよ。","Were","eat は一般動詞なので、Were ではなく Did だよ。","過去の疑問文は Did で始めて、動詞はそのままの形にもどすよ。",""],["中1-10-4","中1-10","一般動詞の過去形","I didn't go to school.","私は学校に行きませんでした。","didn't","don't","過去のことなので didn't を使うよ。","wasn't","go は一般動詞なので、wasn't ではなく didn't だよ。","過去の否定文は didn't ＋ 動詞のそのままの形。","I did not go to school."],["中2-01-1","中2-01","過去形の定着・不規則動詞","I went to Kyoto last weekend.","私は先週末、京都に行きました。","went","goed","go の過去形は went だよ。ed をつけない特別な形だよ。","go","last weekend（先週末）は過去なので went にしよう。","go → went のように、形が大きく変わる動詞（不規則動詞）があるよ。",""],["中2-01-2","中2-01","過去形の定着・不規則動詞","She bought a souvenir for me.","彼女は私におみやげを買ってくれました。","bought","buyed","buy の過去形は bought だよ。","buys","過去のことなので bought を使おう。","buy → bought、take → took、see → saw など、よく使う不規則動詞の過去形を覚えよう。",""],["中2-01-3","中2-01","過去形の定着・不規則動詞","I saw a koala in Australia.","私はオーストラリアでコアラを見ました。","saw","seed","see の過去形は saw だよ。","see","過去のできごとなので saw だよ。","see（見る）→ saw（見た）。",""],["中2-01-4","中2-01","過去形の定着・不規則動詞","We had a great time.","私たちはとても楽しい時間を過ごしました。","had","haved","have の過去形は had だよ。","has","has は今のこと。過去は had だよ。","have / has → had。",""],["中2-02-1","中2-02","過去進行形","I was reading a book at nine.","9時に私は本を読んでいました。","was","am","at nine（9時に）は過去のある時なので was を使うよ。","did","進行形は be動詞を使うよ。did は使わないよ。","「〜していた」は was / were ＋ 動詞の ing 形。",""],["中2-02-2","中2-02","過去進行形","They were waiting for the bus.","彼らはバスを待っていました。","were","was","They（彼ら）は2人以上なので were だよ。","are","過去のことなので were を使おう。","I / he / she / it には was、you / we / they には were を使うよ。",""],["中2-02-3","中2-02","過去進行形","What were you doing then?","そのとき何をしていたの？","were","did","then（そのとき）にしていたことを聞くので were ＋ doing だよ。","are","過去のことなので were だよ。","過去進行形の疑問文は、Was / Were を前に出すよ。",""],["中2-02-4","中2-02","過去進行形","It was raining when I woke up.","私が起きたとき、雨が降っていました。","raining","rained","was のあとは ing の形 raining だよ。","rain","was rain とは言わないよ。","「〜したとき、…していた」と、その時の様子は過去進行形で表すよ。",""],["中2-03-1","中2-03","未来表現（will / be going to）","I will call you tomorrow.","明日、あなたに電話します。","will","did","did は過去のこと。tomorrow（明日）は未来なので will だよ。","am","am call とは言わないよ。「〜します（これから）」は will ＋ 動詞だよ。","その場で決めたことや未来のことは will ＋ 動詞のそのままの形。","I'll call you tomorrow."],["中2-03-2","中2-03","未来表現（will / be going to）","I am going to visit Canada next year.","私は来年カナダを訪れる予定です。","going","go","「〜する予定」は am going to 〜 だよ。","went","went は過去。未来の予定は going to だよ。","前から決めている予定は be going to ＋ 動詞で表すよ。","I'm going to visit Canada next year."],["中2-03-3","中2-03","未来表現（will / be going to）","It will be sunny this weekend.","今週末は晴れるでしょう。","be","is","will のあとは、be動詞の元の形 be を使うよ。","are","will のあとは be だよ。","will のあとの be動詞は、いつも be の形だよ。","It'll be sunny this weekend."],["中2-03-4","中2-03","未来表現（will / be going to）","Are you going to work tomorrow?","明日は仕事に行く予定ですか？","going","go","be going to の疑問文は Are you going to 〜? だよ。","will","Are you will とは言わないよ。","be going to の疑問文は、be動詞を前に出すよ。",""],["中2-04-1","中2-04","助動詞（must / have to / may）","You must show your passport.","パスポートを見せなければなりません。","must","musts","must には s をつけないよ。","can","can は「〜できる」。「〜しなければならない」は must だよ。","「〜しなければならない」は must ＋ 動詞。",""],["中2-04-2","中2-04","助動詞（must / have to / may）","I have to work on Sunday.","私は日曜日に働かなければなりません。","have","has","I のときは have to だよ。has to は he / she のとき。","had","日曜日はこれからのことなので have to だよ。","have to も「〜しなければならない」。he / she なら has to。",""],["中2-04-3","中2-04","助動詞（must / have to / may）","You don't have to pay.","お金を払う必要はありません。","don't","mustn't","mustn't は「〜してはいけない」。「〜しなくていい」は don't have to だよ。","aren't","have は一般動詞なので don't を使うよ。","don't have to は「〜しなくてもいい」という意味だよ。","You do not have to pay."],["中2-04-4","中2-04","助動詞（must / have to / may）","May I come in?","入ってもいいですか？","May","Must","Must I 〜? は「〜しなければならない？」。許可を求めるときは May I 〜? だよ。","Will","Will I come in? は「私は入るでしょうか？」になるよ。","May I 〜? は Can I 〜? よりていねいな「〜してもいいですか？」。",""],["中2-05-1","中2-05","不定詞（to ＋ 動詞）","I want to work in Australia.","私はオーストラリアで働きたいです。","to","for","want のあとに動詞を続けるときは to を使うよ。","in","「〜したい」は want to ＋ 動詞だよ。","to ＋ 動詞で「〜すること」を表すよ（名詞的用法）。",""],["中2-05-2","中2-05","不定詞（to ＋ 動詞）","I saved money to buy a camera.","私はカメラを買うためにお金を貯めました。","to","for","「〜するために」は to ＋ 動詞だよ。for のあとに動詞は続かないよ。","and","and buy だと「貯めて、買った」と別々の動作になるよ。","to ＋ 動詞で「〜するために」と目的を表せるよ（副詞的用法）。",""],["中2-05-3","中2-05","不定詞（to ＋ 動詞）","I have a lot of things to do today.","今日はやることがたくさんあります。","to","for","「〜するための（こと）」は to ＋ 動詞だよ。","doing","things doing だと「している物」になってしまうよ。","名詞 ＋ to ＋ 動詞で「〜するための〇〇」を表すよ（形容詞的用法）。",""],["中2-05-4","中2-05","不定詞（to ＋ 動詞）","It is easy to make a sandwich.","サンドイッチを作るのは簡単です。","to","for","It is 〜 to ＋ 動詞で「…するのは〜だ」を表すよ。","making","It is easy making とは言わないよ。","It is 〜 to ＋ 動詞 で「…するのは〜だ」。","It's easy to make a sandwich."],["中2-06-1","中2-06","動名詞（〜ing）","I enjoy cooking.","私は料理を楽しんでいます。","cooking","cook","enjoy のあとに動詞を続けるときは ing の形にするよ。","to cook","enjoy のあとは to cook ではなく cooking だよ。","enjoy / finish / stop のあとは、動詞の ing 形を使うよ。",""],["中2-06-2","中2-06","動名詞（〜ing）","Swimming is fun.","泳ぐことは楽しいです。","Swimming","Swim","文の主語に動詞を使うときは ing の形にするよ。","Swims","Swims は「泳ぐ」の s の形。主語にするなら Swimming だよ。","動詞の ing 形は「〜すること」という意味で、主語にもなるよ。",""],["中2-06-3","中2-06","動名詞（〜ing）","He finished writing the report.","彼はレポートを書き終えました。","writing","to write","finish のあとは ing の形だよ。","write","finish write とは言わないよ。","finish 〜ing で「〜し終える」。",""],["中2-06-4","中2-06","動名詞（〜ing）","Thank you for helping me.","手伝ってくれてありがとう。","helping","help","for のあとに動詞を置くときは ing の形にするよ。","to help","for to help とは言わないよ。","前置詞（for / at / about など）のあとの動詞は ing 形。",""],["中2-07-1","中2-07","比較（比較級・最上級・as ～ as）","This room is bigger than that one.","この部屋はあの部屋より大きいです。","bigger","biger","big は最後の g を重ねて bigger だよ。","more big","短い単語は more ではなく er をつけるよ。","2つを比べるときは 〜er than。big → bigger のように最後の文字を重ねる単語もあるよ。",""],["中2-07-2","中2-07","比較（比較級・最上級・as ～ as）","Summer is the best season.","夏はいちばんいい季節です。","best","better","3つ以上の中で「いちばん」は best だよ。better は2つを比べるとき。","goodest","good の「いちばん」は best だよ。","good → better → best と形が変わるよ。",""],["中2-07-3","中2-07","比較（比較級・最上級・as ～ as）","Sydney is more expensive than Tokyo.","シドニーは東京より物価が高いです。","more","most","than があるので、2つを比べる more だよ。","very","very expensive than とは言わないよ。","長い単語は more 〜 than で比べるよ。",""],["中2-07-4","中2-07","比較（比較級・最上級・as ～ as）","Ken is as tall as his father.","ケンはお父さんと同じくらい背が高いです。","as","than","「同じくらい」は as 〜 as だよ。","so","so tall as とは言わないよ。as 〜 as にしよう。","as 〜 as で「…と同じくらい〜」。",""],["中2-08-1","中2-08","接続詞（because / when / if / that）","I stayed home because I was sick.","病気だったので、私は家にいました。","because","so","so は結果の前に置くよ。理由の前は because だよ。","but","but は「しかし」。理由を言うときは because だよ。","because ＋ 理由で「〜なので」。",""],["中2-08-2","中2-08","接続詞（because / when / if / that）","When I was a child, I lived in Osaka.","子どものころ、私は大阪に住んでいました。","When","If","If は「もし〜なら」。「〜のとき」は When だよ。","Because","Because だと「子どもだったので」という理由になるよ。","when ＋ 文で「〜するとき」。","I lived in Osaka when I was a child."],["中2-08-3","中2-08","接続詞（because / when / if / that）","If it rains, we will stay inside.","もし雨が降ったら、私たちは中にいます。","If","When","When it rains は「雨が降るときは」。「もし」は If だよ。","Because","Because だと「雨が降るので」と理由になるよ。","if ＋ 文で「もし〜なら」。if の文の中は、未来のことでも今の形（rains）を使うよ。","We will stay inside if it rains."],["中2-08-4","中2-08","接続詞（because / when / if / that）","I think that English is fun.","英語は楽しいと思います。","that","what","「〜と思う」は think that 〜 だよ。","because","because だと理由の意味になるよ。","think that 〜 で「〜だと思う」。that は省略することも多いよ。","I think English is fun."],["中2-09-1","中2-09","There is / There are","There is a bank near the station.","駅の近くに銀行があります。","is","are","a bank（1つ）なので is だよ。","has","There has とは言わないよ。","1つのものは There is、2つ以上は There are。","There's a bank near the station."],["中2-09-2","中2-09","There is / There are","There are many people in the park.","公園にたくさんの人がいます。","are","is","people（人々）は2人以上なので are だよ。","have","There have とは言わないよ。","「〜がいる・ある」は There is / are 〜。",""],["中2-09-3","中2-09","There is / There are","Is there a supermarket near here?","この近くにスーパーはありますか？","there","it", const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function today(){const d=new Date();d.setDate(d.getDate()+(S.dayOffset||0));return iso(d);}
function addDays(s,k){const [y,m,d]=s.split('-').map(Number);return iso(new Date(y,m-1,d+k));}

function markDay(){if(!S.trainDays.includes(today()))S.trainDays.push(today());}
function hit(bucket,id,ok,counts){
  const r=S[bucket][id]||(S[bucket][id]={days:[],seen:0,ok:0});
  const before=mastered(r);const t=today();
  r.seen++; let counted=false;
  /* 単語は正解した回数（同じ日でも数える）、文法は別々の日の数で習得を判定 */
  if(ok){r.ok++; if(counts&&(bucket==='words'||!r.days.includes(t))){r.days.push(t);counted=true;}}
  markDay(); save(); return {rec:r,newly:!before&&mastered(r),counted};

function streak(){const set=new Set(S.trainDays);let d=today();if(!set.has(d))d=addDays(d,-1);let n=0;while(set.has(d)){n++;d=addDays(d,-1);}return n;}

/* いまのレベル：A1から順に見て、習得が8割に届いていない最初のレベル */
function curWordLv(){
  let last=null;
  for(const l of LEVELS){
    const list=WORDS.filter(w=>w.lv===l);if(!list.length)continue;
    if(!lvUnlocked(l))return last||{l:'A1',m:0,n:0};
    const m=list.filter(w=>mastered(S.words[w.id])).length;last={l,m,n:list.length};
    if(m/list.length<0.8)return last;
  }
  return last||{l:'A1',m:0,n:0};
}

/* 出す順番：練習中（今日まだ正解していない）→ はじめて → 今日正解ずみ → 習得ずみ */
function pickWords(list,n){
  const t=today();
  const score=w=>{const r=S.words[w.id];if(!r)return 1;if(mastered(r))return 3;if(r.days.includes(t))return 2;return 0;};
  /* 練習中（1〜2回正解）が30語以上なら、今日正解ずみでも毎セット3問ずつ混ぜる（習得に近いものから） */
  const dn=w=>{const r=S.words[w.id];return r?r.days.length:0;};
  const prac=list.filter(w=>dn(w)>=1&&dn(w)<3);
  let first=[];
  if(prac.length>=30)first=shuffle(prac).sort((a,b)=>dn(b)-dn(a)).slice(0,Math.min(3,n));
  const rest=shuffle(list.filter(w=>!first.includes(w))).sort((a,b)=>score(a)-score(b)).slice(0,n-first.length);
  return shuffle([...first,...rest]);
}
function startWords(list,review){
  let pool=pickWords(list,review?8:10);
  if(review){
    const a1=WORDS.filter(w=>w.lv==='A1');const seen=a1.filter(w=>S.words[w.id]);
    const rv=shuffle(seen.length>=2?seen:a1).slice(0,2).map(w=>Object.assign({},w,{review:true}));
    pool=shuffle([...pool,...rv]);
  }
  W=newSession(pool.map(w=>({w,mode:Math.random()<.5?'listen':'ja2en'})),'words');W.src=list;W.review=review;
  wordQ();
}

/* ===== 文法：間違いの種類に合わせたアドバイス ===== */
const clean=s=>s.replace(/[’‘]/g,"'").replace(/\s+/g,' ').trim().replace(/\s+([?.!,])/g,'$1');
const loose=s=>clean(s).toLowerCase().replace(/[.,!?]/g,'').replace(/\s+/g,' ').trim();
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length];}
function formatNotes(target,user){
  const n=[];const u=clean(user);
  const end=target.slice(-1),uEnd=u.slice(-1);
  if(end==='?'&&uEnd!=='?')n.push('「〜ですか？」「〜してもいい？」のような、たずねる文（疑問文）なので、最後に <b>?</b> をつけよう。');
  else if(end==='.'&&uEnd==='?')n.push('たずねる文ではないので、? ではなく <b>.</b>（ピリオド）で終わろう。');

  const tw=target.split(' ').map(t=>t.replace(/[.,!?]/g,'')),uw=u.split(' ').map(t=>t.replace(/[.,!?]/g,''));
  tw.forEach((t,i)=>{if(i>0&&/^[A-Z]/.test(t)&&t!=='I'&&uw.some(x=>x===t.toLowerCase()))n.push(`<b>${esc(t)}</b> のような地名・国名・言葉の名前は、大文字で始めよう。`);});

function diagnose(g,user){

  const lm=acc.find(a=>loose(a)===loose(u));

  // 単語レベルの比較
  const target=g.sentence;const tw=loose(target).split(' '),uw=loose(u).split(' ').filter(Boolean);
  const notes=[];
  const same=tw.slice().sort().join(' ')===uw.slice().sort().join(' ');
  if(same){
    const i=tw.findIndex((t,k)=>t!==uw[k]);
    notes.push(`使う単語は全部そろっているよ！ 順番を見直そう。英語はふつう「だれが → どうする → 何を・どこで」の順番。`);
    if(i>=0)notes.push(`${i+1}語目は <b>${esc(target.split(' ')[i].replace(/[.,!?]/g,''))}</b> だよ。`);

    const miss=tw.slice(),extra=[];
    uw.forEach(w=>{const k=miss.indexOf(w);if(k>=0)miss.splice(k,1);else extra.push(w);});
    const why=g.why||{};
    for(let e=extra.length-1;e>=0;e--){
      const x=extra[e];const key=Object.keys(why).find(k=>k.toLowerCase()===x);
      if(key){notes.push(why[key]);const mi=miss.indexOf(g.blank.toLowerCase());if(mi>=0)miss.splice(mi,1);extra.splice(e,1);continue;}
      const mi=miss.findIndex(m=>m.length>2&&lev(m,x)<=2&&lev(m,x)<m.length/2);
      if(mi>=0){notes.push(`つづりをチェック：<b>${esc(x)}</b> → <b>${esc(miss[mi])}</b>`);miss.splice(mi,1);extra.splice(e,1);}
    }
    if(miss.length)notes.push(`<b>${miss.map(esc).join('、')}</b> が抜けているよ。`);
    if(extra.length)notes.push(`<b>${extra.map(esc).join('、')}</b> はこの文では使わないよ。`);
  }
  notes.push(...formatNotes(target,u).filter(n=>!/コンマ/.test(n)));
  return {res:'ng',notes};
}

function pAns(k){
  const to=takeTimeout();
  const q=P.qs[P.i];let ok,html;
  const markOpts=(sel,correctIdx)=>document.querySelectorAll(sel).forEach((b,j)=>{b.disabled=true;if(j===correctIdx)b.classList.add('ok');else if(j===k)b.classList.add('ng');});
  if(q.kind==='abc'){
    const l=q.p.l,chosen=q.opts[k];ok=chosen===l;markOpts('.opt',q.opts.indexOf(l));
    const w=q.p.w,i=w.indexOf(l);
    const shown=esc(w.slice(0,i))+'<mark>'+esc(w.slice(i,i+1))+'</mark>'+esc(w.slice(i+1));
    html=`<div class="fb-word"><span class="em" aria-hidden="true">${q.p.img}</span><div><b class="en">${l.toUpperCase()} ${l}</b><span class="en">${shown}</span></div></div>
      <div class="row"><button class="mini" data-act="sayL" data-arg="${l}">▶ ${l} の音</button><button class="mini" data-act="say" data-arg="${esc(w)}">▶ ${esc(w)}</button></div>
      <div class="point"><b>${l} の音</b><p>${esc(LTIP[l]||'')}</p></div>
      ${!ok&&LTIP[chosen]?`<div class="point"><b>あなたが選んだ ${esc(chosen)} の音</b><p>${esc(LTIP[chosen])}</p></div>`:''}`;
  }else if(q.kind==='phon'){
    const ans=q.sub==='first'?q.p.l:q.p.v;const ci=q.opts.indexOf(ans);ok=q.opts[k]===ans;markOpts('.opt',ci);
    S.phonStat=S.phonStat||{};const ps=S.phonStat[q.sub]||(S.phonStat[q.sub]={ok:0,total:0});ps.total++;if(ok)ps.ok++;
    const w=q.p.w,i=q.sub==='first'?0:w.indexOf(ans);
    const shown=esc(w.slice(0,i))+'<mark>'+esc(w.slice(i,i+ans.length))+'</mark>'+esc(w.slice(i+ans.length));
    const chosen=q.opts[k];
    html=`<div class="fb-word"><div><b class="en">${shown}</b><span>${esc(q.p.ja)}</span></div><button class="mini" data-act="say" data-arg="${esc(w)}">▶</button></div>
      <div class="point"><b>${esc(ans)} の音</b><p>${esc(LTIP[ans]||'')}</p></div>
      ${!ok&&LTIP[chosen]?`<div class="point"><b>あなたが選んだ ${esc(chosen)} の音</b><p>${esc(LTIP[chosen])}</p></div>`:''}`;
  }else if(q.kind==='pair'){
    ok=k>=0&&(k===0?'a':'b')===q.t;markOpts('.opt',q.t==='a'?0:1);
    S.phonStat=S.phonStat||{};const pp=S.phonStat.pair||(S.phonStat.pair={ok:0,total:0});pp.total++;if(ok)pp.ok++;
    html=`<p>流れたのは <b class="en">${esc(q.p[q.t])}</b>（${esc(q.p.ja[q.t==='a'?0:1])}）</p>
      <div class="point"><b>ポイント</b><p>${esc(q.p.tip)}</p></div>
      <div class="row"><button class="mini" data-act="say" data-arg="${esc(q.p.a)}">▶ ${esc(q.p.a)}</button><button class="mini" data-act="say" data-arg="${esc(q.p.b)}">▶ ${esc(q.p.b)}</button></div>`;
  }else{
    ok=k===q.p.i;markOpts('.syl',q.p.i);accHit('stress',ok);
    html=`<p class="en-sent">${q.p.syl.map((s,j)=>j===q.p.i?`<mark>${esc(s.toUpperCase())}</mark>`:esc(s)).join('・')}</p>
      <div class="point"><b>ポイント</b><p>大文字のところを、大きく・長く・高く読みます。カタカナの「${esc(q.p.kata)}」とは強さの場所がちがうことがあるので、音で覚えよう。</p></div>
      <div class="row"><button class="mini" data-act="say" data-arg="${esc(q.p.w)}">▶ もう一度聞く</button></div>`;
  }
  S.pron.total++;if(ok)S.pron.ok++;markDay();gain(P,ok);
  const last=P.i===P.qs.length-1;
  $('#fb').innerHTML=`<section class="fb ${ok?'ok':'ng'}"><p class="verdict">${ok?'ナイス！':to?TO_MSG:'おしい！'}</p>${html}<button class="btn" data-act="pNext">${last?'結果を見る':'次へ'}</button></section>`;
  if(q.kind==='phon')speak(q.p.w,.75);
}

/* ===== 音声認識（スピーキング） ===== */
let NO_REC=false;
const NUMW={'0':'zero','1':'one','2':'two','3':'three','4':'four','5':'five','6':'six','7':'seven','8':'eight','9':'nine','10':'ten','11':'eleven','12':'twelve','20':'twenty','50':'fifty','80':'eighty'};
const CONTR={"i'm":'i am',"it's":'it is',"that's":'that is',"i'll":'i will',"don't":'do not',"can't":'can not',"i've":'i have',"you're":'you are',"what's":'what is',"isn't":'is not',"cannot":'can not'};
function spkNorm(s){return String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]/g,' ').split(/\s+/).filter(Boolean)
  .flatMap(w=>(CONTR[w]||NUMW[w.replace(/:00$/,'')]||w).split(' '));}
function spkScore(target,heard){
  const t=spkNorm(target),h=spkNorm(heard);const pool=h.slice();const miss=[];
  t.forEach(w=>{const i=pool.indexOf(w);if(i>=0)pool.splice(i,1);else miss.push(w);});
  return {rate:t.length?(t.length-miss.length)/t.length:0,miss};
}
function spkMarked(target,miss){const m=miss.slice();
  return target.split(' ').map(w=>{const parts=spkNorm(w);const bad=parts.some(p=>{const i=m.indexOf(p);if(i>=0){m.splice(i,1);return true;}return false;});return bad?`<mark>${esc(w)}</mark>`:esc(w);}).join(' ');}

/* ===== ライティングの自動採点 ===== */
function wrNorm(s){return String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[.,!?]/g,' ').replace(/\s+/g,' ').trim();}
function wrCheck(p,raw){
  const u=String(raw).trim();const n=wrNorm(u);const notes=[];
  if(/[^\x00-\x7F]/.test(u))return {ok:false,notes:['英語（半角の文字）で書こう。日本語や全角の文字が入っているよ。']};
  for(const [re,msg] of (p.bad||[]))if(re.test(n))return {ok:false,notes:[msg]};
  const miss=p.req.filter(([re])=>!re.test(n)).map(([,m])=>m);
  if(miss.length)return {ok:false,notes:miss};
  if(/^[a-z]/.test(u))notes.push('文の最初の文字は大文字にしよう。');
  if(/(^|\s)i(\s|'|$)/.test(u))notes.push('I（私は）は、いつも大文字で書くよ。');
  if(p.q&&!/\?$/.test(u))notes.push('たずねる文なので、最後に <b>?</b> をつけよう。');
  else if(!p.q&&!/[.!]$/.test(u))notes.push('最後に <b>.</b>（ピリオド）をつけよう。');
  return {ok:true,notes};
}

        <span class="chsk" aria-hidden="true">${Object.values(SKILL).map(s=>s[1]).join('')}</span></span>

/* ===== チャプターの流れ ===== */
function chItems(c){
  const it=[{t:'learn',sk:'vocab'}];
  c.words.forEach((w,k)=>it.push({t:'vq',sk:'vocab',w,mode:k%2?'ja2en':'listen'}));
  it.push({t:'dlgL',sk:'listen'},{t:'cq',sk:'listen',k:0},{t:'dlgR',sk:'read'},{t:'cq',sk:'read',k:1},{t:'gtip',sk:'gram'});
  c.g.qs.forEach(q=>it.push({t:'gf',sk:'gram',q}));
  c.spk.forEach(s=>it.push({t:'spk',sk:'speak',s}));
  c.wr.forEach(p=>it.push({t:'wr',sk:'write',p}));
  return it;
}
function chStart(id){
  const c=chOf(id);if(!c)return;
  C=newSession(chItems(c),'chap');C.ch=c;C.skill={};
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.arg==='lessons'));
  chQ();
}
function chBar(){const q=C.qs[C.i];const s=SKILL[q.sk];
  return `${sbar(C,'chapters')}<p class="skill"><span aria-hidden="true">${s[1]}</span>${s[0]}<small>${esc(C.ch.title)}</small></p>`;}
function chScore(ok){const q=C.qs[C.i];const k=q.sk;C.skill[k]=C.skill[k]||{ok:0,n:0};C.skill[k].n++;if(ok)C.skill[k].ok++;gain(C,ok);}
function chNextBtn(){return `<button class="btn" data-act="chNext">${C.i===C.qs.length-1?'結果を見る':'次へ'}</button>`;}
function dlgHtml(c,showJa){return `<div class="dlg">${c.dlg.map(([who,en,ja],k)=>`<div class="line ${who===c.dlg[0][0]?'a':'b'}"><span class="who">${esc(who)}</span><div class="bub"><p class="en">${esc(en)}</p>${showJa?`<p class="ja">${esc(ja)}</p>`:''}</div><button class="mini" data-act="say" data-arg="${esc(en)}" aria-label="この文を聞く">▶</button></div>`).join('')}</div>`;}
function playDlg(){
  const c=C.ch;const my=++SEQ;let k=0;
  const next=()=>{if(my!==SEQ||k>=c.dlg.length)return;const [who,en]=c.dlg[k++];
    try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(en);u.lang='en-US';u.rate=.85;
      const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
      const female=/Emma|Sarah|Lily|Staff/.test(who);
      const pick=vs.find(v=>female?/Samantha|Aria|Jenny|Ava|Female|Zira|Google US English/i.test(v.name):/Daniel|Alex|Guy|Male|David|Fred|Google UK English Male/i.test(v.name));
      if(pick)u.voice=pick;else if(VOICE)u.voice=VOICE;
      u.onend=()=>setTimeout(next,350);speechSynthesis.speak(u);}catch(e){}};
  next();
}

      <div class="opts c1">${q.opts.map((o,k)=>`<button class="opt" data-act="chOpt" data-arg="${k}">${esc(o)}</button>`).join('')}</div>`;

      <div id="dl">${dlgHtml(c,false)}</div>
      <div class="row"><button class="btn ghost" data-act="chJa">日本語訳</button><button class="btn" data-act="chNext">問題へ</button></div></section>`;
  }else if(q.t==='gtip'){
    body=`<section class="card"><p class="eyebrow">今日の文法</p><h2>${esc(c.g.title)}</h2><div class="point"><b>ポイント</b><p>${esc(c.g.tip)}</p></div>
      <p class="muted small">会話の中にも出てきたよ。</p>${chNextBtn()}</section>`;
  }else if(q.t==='gf'){
    q.opts=shuffle(q.q.o);const [a,b]=q.q.s.split('___');
    body=`<section class="card q"><p class="eyebrow">穴埋め｜（ ? ）に入る形を選ぼう</p><p class="sent">${esc(a)}<span class="blank">&nbsp;?&nbsp;</span>${esc(b)}</p></section>
      <div class="opts c3">${q.opts.map((o,k)=>`<button class="opt en-opt" data-act="chOpt" data-arg="${k}">${esc(o)}</button>`).join('')}</div>`;
  }else if(q.t==='spk'){
    q.tries=q.tries||0;const ja=(c.dlg.find(d=>d[1]===q.s)||[])[2]||'';const rec=!!recognizer();

      <p class="sent">${esc(q.s)}</p>${ja?`<p class="muted small">${esc(ja)}</p>`:''}
      <div class="row"><button class="mini" data-act="say" data-arg="${esc(q.s)}">▶ お手本</button><button class="mini" data-act="saySlow" data-arg="${esc(q.s)}">🐢 ゆっくり</button></div>
      ${rec?`<button class="mic" id="mic" data-act="chMic" aria-label="マイクで話す">🎤</button><p class="muted small" id="micmsg">マイクをタップして、英文を言おう</p>`
           :`<p class="muted small">お手本を聞いて、声に出して言ってみよう。言えたらタップ。</p><button class="btn" data-act="chSelf">言えた！</button>`}
      </section><div id="fb"></div>`;
  }else if(q.t==='wr'){
    body=`<section class="card q"><p class="eyebrow">ライティング｜英語で書こう</p><p class="prompt">${esc(q.p.ja)}</p>
      <p class="muted small">ヒント：<b class="en">${esc(q.p.hint)}</b></p>
      <textarea id="wr" rows="2" autocapitalize="sentences" autocomplete="off" spellcheck="false" placeholder="英語で書いてみよう"></textarea>
      <button class="btn" data-act="chWr">答え合わせ</button></section><div id="fb"></div>`;
  }
  V.innerHTML=chBar()+body+(['vq','cq','gf'].includes(q.t)?'<div id="fb"></div>':'');
  if(q.t==='vq'&&q.mode==='listen')speak(q.w[0],.85);

  if(q.t==='dlgL')setTimeout(playDlg,300);
  const lim={vq:TLIMIT.word,cq:TLIMIT.cq,gf:TLIMIT.fill,wr:TLIMIT.cwrite}[q.t];

function chOpt(k){
  const to=takeTimeout();const c=C.ch;const q=C.qs[C.i];
  const ans=q.t==='vq'?q.w[q.mode==='listen'?1:0]:q.t==='cq'?c.cq[q.k].o[0]:q.q.o[0];
  const pick=q.opts[k];const ok=pick===ans;
  document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(q.opts[j]===ans)b.classList.add('ok');else if(j===k)b.classList.add('ng');});
  chScore(ok);
  let extra='';
  if(q.t==='vq'){const w=WORDS.find(x=>x.en.toLowerCase()===q.w[0].toLowerCase());if(w){const r=hit('words',w.id,ok,true);if(r.newly)C.newly.push(w.en);}
    extra=`<div class="fb-word"><span class="em" aria-hidden="true">${q.w[2]}</span><div><b class="en">${esc(q.w[0])}</b><span>${esc(q.w[1])}</span></div><button class="mini" data-act="say" data-arg="${esc(q.w[0])}">▶</button></div>`;
    speak(q.w[0],.85);}
  else if(q.t==='gf'){const full=q.q.s.replace('___',q.q.o[0]);
    extra=`${!ok&&pick&&q.q.why[pick]?`<div class="point fix"><b>アドバイス</b><p>${esc(q.q.why[pick])}</p></div>`:''}<p class="en-sent">${esc(full)}</p><div class="row"><button class="mini" data-act="say" data-arg="${esc(full)}">▶ 聞く</button></div>`;
    speak(full,.85);}
  else if(q.t==='cq'&&!ok){extra='<p class="muted small">会話をもう一度聞いたり読んだりして、確かめてみよう。</p>';}
  $('#fb').innerHTML=`<section class="fb ${ok?'ok':'ng'}"><p class="verdict">${ok?'ナイス！':to?TO_MSG:'おしい！ 正解はこちら'}</p>${extra}${chNextBtn()}</section>`;
  markDay();save();
}
function chMic(){
  const q=C.qs[C.i];const r=recognizer();const mic=$('#mic'),msg=$('#micmsg');
  if(!r){NO_REC=true;chQ();return;}
  mic.classList.add('on');mic.disabled=true;msg.textContent='聞いています…英文を言ってください';
  let got=false;
  r.onresult=e=>{got=true;const alts=[...e.results[0]].map(a=>a.transcript);
    let best=null;alts.forEach(h=>{const s=spkScore(q.s,h);if(!best||s.rate>best.rate)best=Object.assign(s,{heard:h});});
    chSpkResult(best);};
  r.onerror=e=>{mic.classList.remove('on');mic.disabled=false;
    if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)){NO_REC=true;toast('マイクが使えないため、自分でチェックする方法に切りかえます');chQ();}
    else if(e.error==='no-speech')msg.textContent='声が聞こえませんでした。もう一度タップしてね';
    else msg.textContent='うまく聞きとれませんでした。もう一度タップしてね';};
  r.onend=()=>{if(!got){mic.classList.remove('on');mic.disabled=false;}};
  try{speechSynthesis.cancel();r.start();}catch(e){NO_REC=true;chQ();}
}
function chSpkResult(b){
  const q=C.qs[C.i];q.tries++;const ok=b.rate>=0.8;const last=ok||q.tries>=3;
  const mic=$('#mic');if(mic){mic.classList.remove('on');mic.disabled=last;}
  const msg=$('#micmsg');if(msg)msg.textContent=last?'':'もう一度マイクをタップして言ってみよう';
  if(last)chScore(ok);
  $('#fb').innerHTML=`<section class="fb ${ok?'ok':'ng'}"><p class="verdict">${ok?'ナイス！ 伝わったよ':last?'おしい！ レッスンで先生と練習しよう':'おしい！ もう一回'}</p>
    <p class="yours">聞こえた英語：<span>${esc(b.heard)}</span></p>
    <p class="en-sent">${spkMarked(q.s,b.miss)}</p>${b.miss.length?'<p class="muted small">黄色の単語が聞きとれませんでした。お手本を聞いてから、もう一度言ってみよう。</p>':''}
    ${last?chNextBtn():''}</section>`;
  markDay();save();
}
function chSelf(){
  const q=C.qs[C.i];chScore(true);document.querySelectorAll('.card.q button').forEach(b=>b.disabled=true);
  $('#fb').innerHTML=`<section class="fb ok"><p class="verdict">ナイス！</p><p class="muted small">音声認識が使えない環境のため、自分でチェックしました。レッスンで先生に聞いてもらおう。</p>${chNextBtn()}</section>`;

function chWr(timeout){

function chSummary(){

/* ===== AIによる「自然さ」のコメント（合否はルール採点のまま） ===== */
let AI_SAMPLE=null;
(async()=>{try{if(window.claude&&typeof window.claude.use==='function')AI_SAMPLE=await window.claude.use('sample');}catch(e){AI_SAMPLE=null;}})();
const AI_RATE={3:['◎','自然！'],2:['○','伝わるけど、もっと自然にできる'],1:['△','少し伝わりにくい']};
async function aiNatural(){
  const box=$('#aiNat');if(!box||!AI_SAMPLE||!SK||!SK.aiIn)return;const a=SK.aiIn;
  box.innerHTML='<b>自然さ（AIのコメント）</b><p class="small muted">AIが考えています…</p>';
  const prompt=`あなたは英語が苦手な日本人の初心者（CEFR ${a.lv}）を教える、やさしい英会話講師です。
生徒が次のお題に英語で答えました。${a.mode==='say'?'答えは音声認識で文字にしたものなので、句読点や大文字・小文字の違いは気にしないでください。発音は評価しないでください。':''}
お題：${a.prompt}
${a.q?`相手が言ったこと：${a.q}\n`:''}今回の文法：${a.grammar||'なし'}
生徒の答え：${a.u}

「英語として自然か（ネイティブがその場面で言いそうか）」だけを評価してください。文法の正しさの細かい指摘はしなくてかまいません。
次の形のJSONだけを返してください。
{"rate": 1〜3の数字（3=自然、2=伝わるがもっと自然にできる、1=伝わりにくい）, "comment": "日本語で60字以内。まずよい点を認め、直すなら1点だけ。否定的な言い方はしない", "better": "同じ内容をより自然に言った英文1つ（${a.lv}レベルの簡単な単語で、12語以内）。すでに自然なら生徒の答えのままでよい"}`;
  try{

      <p class="small">${esc(String((r&&r.comment)||'').slice(0,140))}</p>

      <p class="small muted">AIのコメントは参考です。合格・不合格には関係ありません。</p>`;
  }catch(e){
    const c=e&&e.code;
    const msg=['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c)?'この画面ではAIの評価を使えません。'
      :c==='rate_limited'?'今は混み合っています。少し時間をおいてから、もう一度ためしてください。'
      :c==='cancelled'?'':'うまく評価できませんでした。';
    box.innerHTML=`<b>自然さ（AIのコメント）</b><p class="small muted">${msg}</p>${c==='rate_limited'||c==='upstream_error'||c==='invalid_json'||!c?'<button class="mini" data-act="aiNat">もう一度</button>':''}`;
  }

  [/\b(Im)\b/g,1,"I'm"],[/\b(im)\b(?=\s)/g,1,"I'm"],[/\b(dont)\b/gi,1,"don't"],[/\b(cant)\b/gi,1,"can't"],[/\b(didnt)\b/gi,1,"didn't"],[/\b(doesnt)\b/gi,1,"doesn't"],[/\b(isnt)\b/gi,1,"isn't"],[/\b(thats)\b/gi,1,"that's"],[/\b(whats)\b/gi,1,"what's"],[/\b(lets)\s+(?=[a-z])/g,1,"let's"],[/^(Lets)\b/,1,"Let's"]];
function skSpell(raw){
  const d=skDict();const fixes=[];let first=true;
  for(const [re,g,to] of SK_SPELL_PH)raw=String(raw).replace(re,(...a)=>{const m=a[0],bad=a[g];const fix=/^[A-Z]/.test(bad)&&to!=="I'm"?to.charAt(0).toUpperCase()+to.slice(1):to;fixes.push({from:bad,to:fix});return m.replace(new RegExp(bad+'(?![\\s\\S]*'+bad+')'),fix);});
  const text=String(raw).replace(/[A-Za-z][A-Za-z'’]*/g,(tok,off,all)=>{
    const atStart=first||/[.!?]\s*$/.test(all.slice(0,off));first=false;
    const w=tok.toLowerCase().replace(/’/g,"'");
    if(w.length<3||skKnownWord(w,d))return tok;
    if(!atStart&&/^[A-Z]/.test(tok))return tok; /* 文の途中の大文字は名前（Aki, Tokyo など）としてそのまま */
    const max=w.length<=5?1:2;let best=null,bd=9;
    for(const c of d){if(Math.abs(c.length-w.length)>max||c.length<2)continue;const k=skDist(w,c);
      const better=k<bd||(k===bd&&best&&((c[0]===w[0])-(best[0]===w[0])||(c.length===w.length)-(best.length===w.length))>0);
      if(better){bd=k;best=c;}}
    if(!best||bd>max)return tok;
    let r=best;if(/^[A-Z]/.test(tok))r=r.charAt(0).toUpperCase()+r.slice(1);if(r==='i')r='I';
    fixes.push({from:tok,to:r});return r;
  });
  return {text,fixes};
}
/* 答え1つを採点：els=必要な要素、bonus=ほめる要素、errs=よくある間違い */
function skScore(raw,spec){
  const sp=spec.spell?skSpell(String(raw||'').trim()):{text:raw,fixes:[]};
  const u=String(sp.text||'').trim();const n=skNorm(u);
  const res={pass:false,els:[],bonus:null,errs:[],used:[],notes:[],corrected:'',corrKind:'',empty:!n};
  if(/[぀-ヿ一-鿿]/.test(u)){res.notes.push('英語（半角の文字）で答えよう。日本語が入っているよ。');}
  res.els=(spec.els||[]).map(e=>({name:e.name,pats:e.pats,ok:!!skMatch(e.pats,n)}));
  if(spec.bonus)res.bonus={name:spec.bonus.name,ok:!!skMatch(spec.bonus.pats,n)};
  for(const e of (spec.errs||[])){
    if(skMatch(e.right,n))continue; /* 正しい形も入っていれば間違いとしない（例：Can I have は I have を含む） */
    for(const w of skAlts(e.wrong)){const m=n.match(skRegex(w));if(m){res.errs.push({e,m,w});break;}}
  }
  const seen=new Set();
  for(const k of (spec.known||[])){const kn=skNorm(k);if(kn&&!seen.has(kn)&&(' '+n+' ').includes(' '+kn+' ')){seen.add(kn);res.used.push(k);}}
  res.pass=!!n&&!res.notes.length&&res.els.every(x=>x.ok)&&!res.errs.length;
  /* 指摘は大事な順に最大2つ：内容 → 学んだ文法の間違い → 形 */
  const miss=res.els.filter(x=>!x.ok);
  if(!res.notes.length){
    /* よくある間違いに当てはまったら、その具体的な解説を先に出す */
    res.errs.forEach(x=>res.notes.push(esc(x.e.why||'正しい形と見比べてみよう。')));
    miss.forEach(x=>res.notes.push(`「${esc(x.name)}」が入っていないよ。例：<b class="en">${esc(skFill(skAlts(x.pats)[0]))}</b>`));
  }
  if(res.pass){
    if(/^[a-z]/.test(u))res.notes.push('文の最初の文字は大文字にしよう。');
    else if(/(^|\s)i(\s|'|$)/.test(u))res.notes.push('I（私は）は、いつも大文字で書くよ。');
  }
  res.notes=res.notes.slice(0,2);
  /* 修正した英文：よくある間違いの形に当てはまるときだけ直す */
  if(res.errs.length){
    /* まず生徒の文そのもの（大文字・句読点を残す）で、間違った部分だけを直す */
    let raw=u,okRaw=true;
    for(const x of res.errs){let done=false;
      for(const w of skAlts(x.e.wrong)){const rr=skRawRegex(w);const m=raw.match(rr);if(!m)continue;
        const caps=m.slice(2);let i=0;const right=String(x.e.right).replace(/_{2,}/g,()=>caps[i++]||'…');
        raw=raw.slice(0,m.index)+m[1]+right+raw.slice(m.index+m[0].length);done=true;break;}
      if(!done){okRaw=false;break;}}
    if(okRaw){res.corrected=skNice(raw);res.corrKind='fix';}
  }
  if(res.errs.length&&!res.corrected){
    let t=' '+n+' ';
    for(const x of res.errs){const caps=x.m.slice(1);let i=0;const right=skNorm(x.e.right).replace(/_{2,}/g,'___').replace(/___/g,()=>caps[i++]||'…');t=t.replace(x.m[0],(x.m[0].startsWith(' ')?' ':'')+right);}
    res.corrected=skNice(t.trim());res.corrKind='fix';
  }else if(!res.corrected&&!res.pass&&(spec.examples||[]).length){
    const words=new Set(n.split(' '));let best=null,bs=-1;
    for(const ex of spec.examples){const s=skNorm(ex).split(' ').filter(w=>words.has(w)).length;if(s>bs){bs=s;best=ex;}}
    res.corrected=best;res.corrKind='near';
  }
  /* 間違いを直せば満たせる要素は「〜が入っていないよ」を出さない（同じことを2回言わない） */
  if(res.corrKind==='fix'&&!/[\u3040-\u30ff\u4e00-\u9fff]/.test(u)){
    const cn=skNorm(res.corrected);const still=miss.filter(x=>!skMatch(x.pats,cn));
    res.notes=[...res.errs.map(x=>esc(x.e.why||'正しい形と見比べてみよう。')),...still.map(x=>`「${esc(x.name)}」が入っていないよ。例：<b class="en">${esc(skFill(skAlts(x.pats)[0]))}</b>`)].slice(0,2);
  }
  /* スペルミスは、いちばん上に出す */
  if(sp.fixes.length){
    const seen={};sp.fixes=sp.fixes.filter(f=>!seen[f.from+'>'+f.to]&&(seen[f.from+'>'+f.to]=1));res.spell=sp.fixes;
    res.notes.unshift(`スペルミス：${sp.fixes.map(f=>`<b class="en">${esc(f.from)}</b> → <b class="en">${esc(f.to)}</b>`).join('、')}`);
    if(!res.corrected){res.corrected=skNice(u);res.corrKind='fix';}
  }
  return res;
}

/* ---- 時間の設定（標準・ゆっくり・なし） ---- */
const TMODE={std:['標準',1],slow:['ゆっくり',1.5],off:['時間なし',0]};

function skTimes(L){
  const i=allLessons().indexOf(L);const k=L.lv==='A2'?'A2':i>=2?'A1b':'A1';
  return {A1:{prep:10,say:20,write:60},A1b:{prep:7,say:15,write:50},A2:{prep:5,say:15,write:45}}[k];

const REV_GAP=[1,3,7];
function revAdd(key,item){
  S.rev=S.rev||[];if(S.rev.some(r=>r.key===key))return false;
  S.rev.push(Object.assign({key,lv:0,due:addDays(today(),1),added:today()},item));return true;
}
const revDue=()=>(S.rev||[]).filter(r=>r.due<=today());

let LS=null;
function lesItems(L){
  const it=[{t:'goal',sk:'start'}];
  if(L.sk)it.push({t:'sk',sk:'sokko',phase:'pre'});
  if(L.words.length){it.push({t:'learn',sk:'vocab'});L.words.forEach((w,k)=>it.push({t:'vq',sk:'vocab',w,mode:k%2?'ja2en':'listen'}));}
  const qs=t=>L.qs.filter(q=>q.type===t);
  if(L.dlg.length){it.push({t:'dlgL',sk:'listen'});qs('listen').forEach(q=>it.push({t:'cq',sk:'listen',q}));
    it.push({t:'dlgR',sk:'read'});qs('read').forEach(q=>it.push({t:'cq',sk:'read',q}));}
  if(L.gTitle||qs('gram').length){it.push({t:'gtip',sk:'gram'});qs('gram').forEach(q=>it.push({t:'gf',sk:'gram',q}));}
  qs('oral').forEach(q=>it.push({t:'oral',sk:'speak',q}));
  qs('qa').forEach(q=>it.push({t:'qa',sk:'speak',q}));
  qs('write').forEach(q=>it.push({t:'wr',sk:'write',q}));
  if(L.sk)it.push({t:'sk',sk:'sokko',phase:'post'});
  return it;
}

function lesPlay(){
  const L=LS.L;const my=++SEQ;let k=0;const first=L.dlg[0][0];
  const next=()=>{if(my!==SEQ||k>=L.dlg.length)return;const [who,en]=L.dlg[k++];
    try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(en);u.lang='en-US';u.rate=.85;
      const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
      const pick=who===first?(vs.find(v=>/Samantha|Aria|Jenny|Ava|Female|Zira/i.test(v.name))||VOICE):(vs.find(v=>/Daniel|Alex|Guy|Male|David|Fred/i.test(v.name))||VOICE);
      if(pick)u.voice=pick;u.onend=()=>setTimeout(next,350);speechSynthesis.speak(u);}catch(e){}};
  next();
}

  r.onload=()=>{const old=AUD[l];AUD[l]=r.result;
    if(saveAud()){toast(`${l} の音を登録しました`);vPhonSet();playLetter(l);}
    else{if(old)AUD[l]=old;else delete AUD[l];toast('保存できませんでした（端末の保存容量が足りません）');}};
  r.onerror=()=>toast('ファイルを読み込めませんでした');
  r.readAsDataURL(f);
});
go('home');
